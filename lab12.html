<!DOCTYPE html>
<html>
<head>
  <title>Greeting and Calculator</title>
</head>
<body>

  <h1>Greeting and Calculator</h1>

  <p>1. Type your name.</p>
  <p>2. Enter two numbers.</p>
  <p>3. Choose an operation.</p>
  <p>4. Click "Calculate" to see the answer.</p>
  <p>5. Click "Clear" to start again.</p>

  <p>
    Name: <input type="text" id="name">
    <button onclick="greet()">Greet Me</button>
  </p>
  <p id="greeting"></p>

  <p>First number: <input type="number" id="num1"></p>
  <p>Second number: <input type="number" id="num2"></p>

  <p>
    <input type="radio" name="op" value="add"> add
    <input type="radio" name="op" value="subtract"> subtract 
    <input type="radio" name="op" value="multiply"> multiply
    <input type="radio" name="op" value="divide"> divide
  </p>

  <button onclick="calculate()">Calculate</button>
  <button onclick="clearAll()">Clear</button>

  <p id="result"></p>

  <script>
    function greet() {
      var name = document.getElementById("name").value;
      if (name == "") {
        document.getElementById("greeting").innerHTML = "Please enter your name.";
      } else {
        document.getElementById("greeting").innerHTML = "Hello, " + name + "!";
      }
    }

    function calculate() {
      var num1 = parseFloat(document.getElementById("num1").value);
      var num2 = parseFloat(document.getElementById("num2").value);
      var choice = document.querySelector('input[name="op"]:checked');
      var answer;

      if (choice.value == "add") {
        answer = num1 + num2;
      } else if (choice.value == "subtract") {
        answer = num1 - num2;
      } else if (choice.value == "multiply") {
        answer = num1 * num2;
      } else if (choice.value == "divide") {
        if (num2 == 0) {
          document.getElementById("result").innerHTML = "You cannot divide by zero.";
          return;
        }
        answer = num1 / num2;
      }

      document.getElementById("result").innerHTML = "Result: " + answer;
    }

    function clearAll() {
      document.getElementById("name").value = "";
      document.getElementById("num1").value = "";
      document.getElementById("num2").value = "";
      document.getElementById("greeting").innerHTML = "";
      document.getElementById("result").innerHTML = "";

      var radios = document.getElementsByName("op");
      for (var i = 0; i < radios.length; i++) {
        radios[i].checked = false;
      }
    }
  </script>

</body>
</html>
