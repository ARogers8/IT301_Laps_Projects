<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 14</title>
</head>
<body>

  <h1>Random User Profile</h1>

  <div class="card">
    <img id="picture" src="" alt="User picture">
    <h2 id="name">Loading...</h2>
    <p id="email"></p>
    <p id="phone"></p>
  </div>

  <button id="generateBtn">Generate Profile</button>

  <script>
    function getUser() {
      fetch("https://randomuser.me/api/")
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          let user = data.results[0];
          document.getElementById("picture").src = user.picture.large;
          document.getElementById("name").textContent = user.name.first + " " + user.name.last;
          document.getElementById("email").textContent = "Email: " + user.email;
          document.getElementById("phone").textContent = "Phone: " + user.phone;
        })
        .catch(function (error) {
          document.getElementById("name").textContent = "Could not load user";
          console.log(error);
        });
    }
    getUser();
    document.getElementById("generateBtn").addEventListener("click", getUser);
  </script>

</body>
</html>
