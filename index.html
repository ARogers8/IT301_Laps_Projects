<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
       body {
          background-color: #f0f2f5;
          font-family: Helvetica, Arial, sans-serif;
       }

       form {
          min-height: 180px;
       }

       article, form {
          background-color: #ffffff;
          border-radius: 8px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
          padding: 12px 16px;
          margin-bottom: 16px;
          max-width: 680px;
          margin-left: auto;
          margin-right: auto;
       }

       h2 {
          color: #050505;
          font-size: 0.9375rem;
          font-weight: 600;
          margin: 0 0 4px 0;
       }

       p {
          color: #050505;
          font-size: 0.9375rem;
          line-height: 1.3333;
          margin: 8px 0 0 0;
       }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>
        
    <script>
    let posts = [];

    fetch('https://jsonplaceholder.typicode.com/posts')
        .then(response => response.json())
        .then(data => {
            posts = data;
            console.table(posts);
            posts.forEach(post => displayPosts(post));
        })
        .catch(error => console.error('Error fetching posts:', error));

    function displayPosts(post) {
        const article = document.createElement('article');
        const title = document.createElement('h2');
        title.textContent = post.title;
        const body = document.createElement('p');
        body.textContent = post.body;
        const userId = document.createElement('p');
        userId.textContent = `User ID: ${post.userId}`;
        const postId = document.createElement('p');
        postId.textContent = `Post ID: ${post.id}`;
        article.appendChild(title);
        article.appendChild(body);
        article.appendChild(userId);
        article.appendChild(postId);
        document.body.appendChild(article);
    }

    document.getElementById('filterBtn').addEventListener('click', () => {
        const userID = document.getElementById('userID').value;
        if (userID) {
            fetch(`https://jsonplaceholder.typicode.com/posts?userId=${userID}`)
                .then(response => response.json())
                .then(userPosts => {
                    console.table(userPosts);
                })
                .catch(error => console.error('Error fetching posts:', error));
        }
    });
    document.getElementById('displayUserBtn').addEventListener('click', () => {
        const userID = document.getElementById('displayUserID').value;
        if (userID) {
            fetch(`https://jsonplaceholder.typicode.com/posts?userId=${userID}`)
                .then(response => response.json())
                .then(userPosts => {
                    document.querySelectorAll('article').forEach(article => article.remove());
                    userPosts.forEach(post => displayPosts(post));
                })
                .catch(error => console.error('Error fetching posts:', error));
        }
    });

    document.getElementById('findBtn').addEventListener('click', () => {
        const postID = document.getElementById('postID').value;
        if (postID) {
            fetch(`https://jsonplaceholder.typicode.com/posts/${postID}`)
                .then(response => response.json())
                .then(post => {
                    document.querySelectorAll('article').forEach(article => article.remove());
                    if (post.id) {
                        displayPosts(post);
                    } else {
                        const article = document.createElement('article');
                        article.innerHTML = `<p>Post ${postID} not found.</p>`;
                        document.body.appendChild(article);
                    }
                })
                .catch(error => console.error('Error fetching post:', error));
        }
    });
</script>


</body>
</html>
