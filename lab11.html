<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab11</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 32px 16px;
      margin: 0;
    }

    #moodButton {
      font-size: 1.5rem;     
      padding: 20px 40px;   
      min-width: 280px;
      border: none;
      border-radius: 12px;
      background-color: blue;
      color: white;
      cursor: pointer;
    }

    #watchZone {
      height: 75vh;
      width: 100%;
      max-width: 900px;
      background-color: #eeeeee;
      border: 2px dashed #bbbbbb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555555;
    }
  </style>
</head>
<body>

  <button id="moodButton">Click Me! 😊</button>

  <div id="watchZone">Move your mouse around in here</div>

  <script>
    const button = document.getElementById("moodButton");
    const zone = document.getElementById("watchZone");

    button.addEventListener("mouseover", function () {
      button.textContent = "Do not click! 😠";
      button.style.backgroundColor = "yellow";
      button.style.color = "black";
    });

    button.addEventListener("click", function () {
      button.textContent = "Ouch! 🤕";
      button.style.backgroundColor = "red";
      button.style.color = "white";
    });

    button.addEventListener("mouseleave", function () {
      button.textContent = "Phew! 😌";
      button.style.backgroundColor = "lightgreen";
      button.style.color = "black";
    });

    button.addEventListener("dblclick", function () {
      button.textContent = "Double trouble! 🤩";
      button.style.backgroundColor = "pink";
      button.style.color = "black";
    });

    zone.addEventListener("mousemove", function () {
      button.textContent = "I see you! 👀";
      button.style.backgroundColor = "lightblue";
      button.style.color = "black";
    });
    </script>
    </body>
    </html>
